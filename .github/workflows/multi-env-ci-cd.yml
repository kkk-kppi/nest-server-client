name: multi-env-ci-cd

on:
  push:
    branches:
      - develop
      - test
      - stage
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - develop
      - test
      - stage
      - main
  workflow_dispatch:
    inputs:
      action:
        type: choice
        description: deploy or rollback
        required: true
        default: deploy
        options:
          - deploy
          - rollback
      target:
        type: choice
        description: target environment
        required: true
        default: dev
        options:
          - dev
          - test
          - stage
          - prod
          - all
      rollback_version:
        type: string
        description: rollback version tag or release id
        required: false

concurrency:
  group: multi-env-ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  quality:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'deploy'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm verify:api
      - run: pnpm build

  build_artifact:
    runs-on: ubuntu-latest
    needs: quality
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: dist

  deploy_dev:
    runs-on: ubuntu-latest
    needs: build_artifact
    environment: dev
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy' && (github.event.inputs.target == 'dev' || github.event.inputs.target == 'all'))
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: dist
      - run: |
          if [ -z "${{ secrets.DEV_DEPLOY_COMMAND }}" ]; then
            echo "DEV_DEPLOY_COMMAND is not configured."
            exit 1
          fi
          eval "${{ secrets.DEV_DEPLOY_COMMAND }}"

  deploy_test:
    runs-on: ubuntu-latest
    needs: build_artifact
    environment: test
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/test') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy' && (github.event.inputs.target == 'test' || github.event.inputs.target == 'all'))
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: dist
      - run: |
          if [ -z "${{ secrets.TEST_DEPLOY_COMMAND }}" ]; then
            echo "TEST_DEPLOY_COMMAND is not configured."
            exit 1
          fi
          eval "${{ secrets.TEST_DEPLOY_COMMAND }}"

  deploy_stage:
    runs-on: ubuntu-latest
    needs: build_artifact
    environment: stage
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/stage') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy' && (github.event.inputs.target == 'stage' || github.event.inputs.target == 'all'))
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: dist
      - run: |
          if [ -z "${{ secrets.STAGE_DEPLOY_COMMAND }}" ]; then
            echo "STAGE_DEPLOY_COMMAND is not configured."
            exit 1
          fi
          eval "${{ secrets.STAGE_DEPLOY_COMMAND }}"

  deploy_prod:
    runs-on: ubuntu-latest
    needs: build_artifact
    environment: prod
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy' && (github.event.inputs.target == 'prod' || github.event.inputs.target == 'all'))
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: dist
      - run: |
          if [ -z "${{ secrets.PROD_DEPLOY_COMMAND }}" ]; then
            echo "PROD_DEPLOY_COMMAND is not configured."
            exit 1
          fi
          eval "${{ secrets.PROD_DEPLOY_COMMAND }}"

  rollback:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback' && github.event.inputs.target != 'all'
    environment: ${{ github.event.inputs.target }}
    steps:
      - run: |
          TARGET="${{ github.event.inputs.target }}"
          if [ "$TARGET" = "all" ]; then
            echo "Rollback does not support target=all. Please choose a single environment."
            exit 1
          fi
          case "$TARGET" in
            dev)
              CMD='${{ secrets.DEV_ROLLBACK_COMMAND }}'
              ;;
            test)
              CMD='${{ secrets.TEST_ROLLBACK_COMMAND }}'
              ;;
            stage)
              CMD='${{ secrets.STAGE_ROLLBACK_COMMAND }}'
              ;;
            prod)
              CMD='${{ secrets.PROD_ROLLBACK_COMMAND }}'
              ;;
            *)
              echo "Unknown target: $TARGET"
              exit 1
              ;;
          esac
          if [ -z "$CMD" ]; then
            echo "Rollback command is not configured for $TARGET."
            exit 1
          fi
          RELEASE_VERSION="${{ github.event.inputs.rollback_version }}" eval "$CMD"
