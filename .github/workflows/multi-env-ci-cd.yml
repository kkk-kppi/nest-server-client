name: multi-env-ci-cd

on:
  push:
    branches:
      - develop
      - test
      - stage
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - develop
      - test
      - stage
      - main
  workflow_dispatch:
    inputs:
      target:
        type: choice
        description: target environment
        required: true
        default: dev
        options:
          - dev
          - test
          - stage
          - prod
          - all

concurrency:
  group: multi-env-ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm verify:api
      - run: pnpm build

  build_artifact:
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: dist

  deploy_dev:
    runs-on: ubuntu-latest
    needs: build_artifact
    environment: dev
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'dev' || github.event.inputs.target == 'all'))
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: dist
      - run: |
          if [ -n "${{ secrets.DEV_DEPLOY_COMMAND }}" ]; then
            eval "${{ secrets.DEV_DEPLOY_COMMAND }}"
          else
            echo "DEV_DEPLOY_COMMAND is not configured. Skip deploy."
          fi

  deploy_test:
    runs-on: ubuntu-latest
    needs: build_artifact
    environment: test
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/test') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'test' || github.event.inputs.target == 'all'))
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: dist
      - run: |
          if [ -n "${{ secrets.TEST_DEPLOY_COMMAND }}" ]; then
            eval "${{ secrets.TEST_DEPLOY_COMMAND }}"
          else
            echo "TEST_DEPLOY_COMMAND is not configured. Skip deploy."
          fi

  deploy_stage:
    runs-on: ubuntu-latest
    needs: build_artifact
    environment: stage
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/stage') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'stage' || github.event.inputs.target == 'all'))
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: dist
      - run: |
          if [ -n "${{ secrets.STAGE_DEPLOY_COMMAND }}" ]; then
            eval "${{ secrets.STAGE_DEPLOY_COMMAND }}"
          else
            echo "STAGE_DEPLOY_COMMAND is not configured. Skip deploy."
          fi

  deploy_prod:
    runs-on: ubuntu-latest
    needs: build_artifact
    environment: prod
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'prod' || github.event.inputs.target == 'all'))
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: dist
      - run: |
          if [ -n "${{ secrets.PROD_DEPLOY_COMMAND }}" ]; then
            eval "${{ secrets.PROD_DEPLOY_COMMAND }}"
          else
            echo "PROD_DEPLOY_COMMAND is not configured. Skip deploy."
          fi
