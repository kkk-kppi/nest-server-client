name: multi-env-ci-cd

on:
  push:
    branches:
      - develop
      - test
      - stage
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - develop
      - test
      - stage
      - main
  workflow_dispatch:
    inputs:
      action:
        type: choice
        description: deploy or rollback
        required: true
        default: deploy
        options:
          - deploy
          - rollback
      target:
        type: choice
        description: target environment
        required: true
        default: dev
        options:
          - dev
          - test
          - stage
          - prod
          - all
      rollback_version:
        type: string
        description: rollback version tag or release id
        required: false
      dry_run:
        type: boolean
        description: validate workflow without executing deploy/rollback commands
        required: true
        default: true

concurrency:
  group: multi-env-ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  VITE_ENABLE_MOCK: 'false'
  VITE_ENTRY_JS_BUDGET_KIB: '300'
  VITE_ASYNC_CHUNK_BUDGET_KIB: '500'

jobs:
  quality:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'deploy'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - &resolve_build_preset_step
        name: Resolve build preset
        run: |
          PRESET="production"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.action }}" = "deploy" ]; then
            case "${{ github.event.inputs.target }}" in
              dev) PRESET="development" ;;
              test) PRESET="test" ;;
              stage) PRESET="stage" ;;
              prod) PRESET="prod" ;;
              all)
                case "${{ github.ref }}" in
                  refs/heads/develop) PRESET="development" ;;
                  refs/heads/test) PRESET="test" ;;
                  refs/heads/stage) PRESET="stage" ;;
                  refs/heads/main|refs/tags/v*) PRESET="prod" ;;
                esac
                ;;
            esac
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            case "${{ github.base_ref }}" in
              develop) PRESET="development" ;;
              test) PRESET="test" ;;
              stage) PRESET="stage" ;;
              main) PRESET="prod" ;;
            esac
          else
            case "${{ github.ref }}" in
              refs/heads/develop) PRESET="development" ;;
              refs/heads/test) PRESET="test" ;;
              refs/heads/stage) PRESET="stage" ;;
              refs/heads/main|refs/tags/v*) PRESET="prod" ;;
            esac
          fi
          echo "VITE_BUILD_PRESET=$PRESET" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm verify:api
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-report-${{ github.sha }}
          path: dist/bundle-report.html

  build_artifact:
    runs-on: ubuntu-latest
    needs: quality
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - <<: *resolve_build_preset_step
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: dist

  image_scan:
    runs-on: ubuntu-latest
    needs: build_artifact
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: dist
      - name: Build Docker image
        run: docker build -t app:${{ github.sha }} .
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'app:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

  deploy_dev:
    runs-on: ubuntu-latest
    needs: [build_artifact, image_scan]
    environment: dev
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy' && (github.event.inputs.target == 'dev' || github.event.inputs.target == 'all'))
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: dist
      - run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "Dry run enabled. Skip DEV_DEPLOY_COMMAND execution."
            exit 0
          fi
          if [ -z "${{ secrets.DEV_DEPLOY_COMMAND }}" ]; then
            echo "DEV_DEPLOY_COMMAND is not configured."
            exit 1
          fi
          eval "${{ secrets.DEV_DEPLOY_COMMAND }}"

  deploy_test:
    runs-on: ubuntu-latest
    needs: [build_artifact, image_scan]
    environment: test
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/test') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy' && (github.event.inputs.target == 'test' || github.event.inputs.target == 'all'))
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: dist
      - run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "Dry run enabled. Skip TEST_DEPLOY_COMMAND execution."
            exit 0
          fi
          if [ -z "${{ secrets.TEST_DEPLOY_COMMAND }}" ]; then
            echo "TEST_DEPLOY_COMMAND is not configured."
            exit 1
          fi
          eval "${{ secrets.TEST_DEPLOY_COMMAND }}"

  deploy_stage:
    runs-on: ubuntu-latest
    needs: [build_artifact, image_scan]
    environment: stage
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/stage') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy' && (github.event.inputs.target == 'stage' || github.event.inputs.target == 'all'))
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: dist
      - run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "Dry run enabled. Skip STAGE_DEPLOY_COMMAND execution."
            exit 0
          fi
          if [ -z "${{ secrets.STAGE_DEPLOY_COMMAND }}" ]; then
            echo "STAGE_DEPLOY_COMMAND is not configured."
            exit 1
          fi
          eval "${{ secrets.STAGE_DEPLOY_COMMAND }}"

  deploy_prod:
    runs-on: ubuntu-latest
    needs: [build_artifact, image_scan]
    environment: prod
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy' && (github.event.inputs.target == 'prod' || github.event.inputs.target == 'all'))
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: dist
      - run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "Dry run enabled. Skip PROD_DEPLOY_COMMAND execution."
            exit 0
          fi
          if [ -z "${{ secrets.PROD_DEPLOY_COMMAND }}" ]; then
            echo "PROD_DEPLOY_COMMAND is not configured."
            exit 1
          fi
          eval "${{ secrets.PROD_DEPLOY_COMMAND }}"

  rollback:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback' && github.event.inputs.target != 'all'
    environment: ${{ github.event.inputs.target }}
    steps:
      - run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "Dry run enabled. Skip rollback command execution."
            exit 0
          fi
          TARGET="${{ github.event.inputs.target }}"
          if [ "$TARGET" = "all" ]; then
            echo "Rollback does not support target=all. Please choose a single environment."
            exit 1
          fi
          case "$TARGET" in
            dev)
              CMD='${{ secrets.DEV_ROLLBACK_COMMAND }}'
              ;;
            test)
              CMD='${{ secrets.TEST_ROLLBACK_COMMAND }}'
              ;;
            stage)
              CMD='${{ secrets.STAGE_ROLLBACK_COMMAND }}'
              ;;
            prod)
              CMD='${{ secrets.PROD_ROLLBACK_COMMAND }}'
              ;;
            *)
              echo "Unknown target: $TARGET"
              exit 1
              ;;
          esac
          if [ -z "$CMD" ]; then
            echo "Rollback command is not configured for $TARGET."
            exit 1
          fi
          RELEASE_VERSION="${{ github.event.inputs.rollback_version }}" eval "$CMD"
