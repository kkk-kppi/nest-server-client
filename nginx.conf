worker_processes auto;
pid /tmp/nginx/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "1; mode=block" always;

    # CSP - allow connections to configured API and Sentry
    # In production, this should be configured via environment variable
    set $csp_connect_src "'self'";
    if ($http_origin ~* "^https?://(localhost|127\.0\.0\.1)(:\d+)?$") {
      set $csp_connect_src "'self' http://localhost:3000 http://127.0.0.1:3000";
    }
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src $csp_connect_src; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Health check endpoints
    location = /healthz {
      add_header Content-Type text/plain;
      return 200 'ok';
    }

    location = /readyz {
      add_header Content-Type text/plain;
      if (!-f /usr/share/nginx/html/runtime-config.js) {
        return 503 'not ready';
      }
      if (!-f /usr/share/nginx/html/index.html) {
        return 503 'not ready';
      }
      return 200 'ready';
    }

    # Runtime config - no cache
    location = /runtime-config.js {
      add_header Cache-Control "no-store, no-cache, must-revalidate";
      add_header Pragma "no-cache";
      add_header Expires "0";
    }

    # Static assets with hash - immutable cache
    location ~* /assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML - no cache
    location = /index.html {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      add_header Pragma "no-cache";
      add_header Expires "0";
    }

    # SPA fallback
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
